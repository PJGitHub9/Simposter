name: Feature Request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Simposter better? Describe the problem you're running into first — the "why" is often more useful than the exact solution, even if you're not sure what it should look like.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      placeholder: I have a library with a lot of anime and the logo fallback rules don't work well for...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen? Mockups or screenshots are welcome.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're currently using, or other approaches you thought about.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
